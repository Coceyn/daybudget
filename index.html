<style>
:root{
  --bg:#f6f1ea; --card:#fffdf9; --ink:#2f2c28; --muted:#7b746a; --line:#e6ded2;
  --accent:#b5653f; --accent-ink:#fff; --sage:#6f8f75; --sage-soft:#dfe8dc; --peach:#f3e3d6;
  --warn:#a8552f; --good:#4f7a5a; --shadow:0 1px 2px rgba(47,44,40,.06),0 6px 18px rgba(47,44,40,.06);
  --r:18px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1d1b19; --card:#282521; --ink:#f1ece4; --muted:#a69d91; --line:#3a352f;
    --accent:#d68a62; --accent-ink:#1d1b19; --sage:#93b39a; --sage-soft:#2f3a31; --peach:#3d2f27;
    --warn:#e39a74; --good:#93b39a; --shadow:none;
  }
}
:root[data-theme="dark"]{
  --bg:#1d1b19; --card:#282521; --ink:#f1ece4; --muted:#a69d91; --line:#3a352f;
  --accent:#d68a62; --accent-ink:#1d1b19; --sage:#93b39a; --sage-soft:#2f3a31; --peach:#3d2f27;
  --warn:#e39a74; --good:#93b39a; --shadow:none;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
.app{max-width:480px;margin:0 auto;min-height:100vh;padding:max(18px,env(safe-area-inset-top)) 16px calc(96px + env(safe-area-inset-bottom))}
header.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
.date{font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
h1{font-size:26px;margin:2px 0 0;font-weight:700;letter-spacing:-.01em}
h2{font-size:15px;margin:0 0 10px;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;font-weight:700}
.chip-btn{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:8px 14px;font-size:14px;font-weight:600;cursor:pointer;min-height:40px}
.chip-btn[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px;margin-bottom:14px;box-shadow:var(--shadow)}
.hero{text-align:center;padding:22px 18px}
.hero .label{font-size:13px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.hero .big{font-size:56px;font-weight:800;letter-spacing:-.03em;line-height:1.05;margin:8px 0 6px}
.hero .big.neg{color:var(--warn)}
.hero .sub{color:var(--muted);font-size:15px}
.bar{height:10px;border-radius:99px;background:var(--sage-soft);overflow:hidden;margin:14px 0 4px}
.bar > i{display:block;height:100%;background:var(--sage);border-radius:99px;transition:width .3s}
.bar.over > i{background:var(--warn)}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;border:0;border-radius:16px;padding:16px;font-size:18px;font-weight:700;cursor:pointer;min-height:56px}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent;border:1.5px solid var(--line);color:var(--ink);font-size:16px;min-height:48px;padding:12px}
.btn.small{font-size:15px;min-height:44px;padding:10px 14px;width:auto;border-radius:12px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.list{list-style:none;margin:0;padding:0}
.list li{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.list li:first-child{border-top:0}
.list .grow{flex:1;min-width:0}
.list .t{font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.list .s{font-size:13px;color:var(--muted)}
.amt{font-weight:750;font-variant-numeric:tabular-nums;white-space:nowrap}
.icon-btn{border:0;background:transparent;color:var(--muted);font-size:20px;width:44px;height:44px;border-radius:12px;cursor:pointer}
.icon-btn:hover{background:var(--sage-soft)}
.mini{border:1px solid var(--line);background:transparent;border-radius:10px;padding:8px 12px;font-size:14px;font-weight:650;cursor:pointer;min-height:40px}
.empty{color:var(--muted);font-size:15px;padding:6px 0}
.note{background:var(--peach);border-radius:14px;padding:14px;font-size:15px;margin-bottom:14px;display:flex;gap:12px;align-items:center}
.note .grow{flex:1}
.pill{display:inline-block;font-size:12px;font-weight:700;border-radius:99px;padding:3px 9px;background:var(--sage-soft);color:var(--sage)}
.pill.due{background:var(--peach);color:var(--accent)}
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom);z-index:5}
nav.tabs .in{display:flex;max-width:480px;width:100%}
nav.tabs button{flex:1;border:0;background:transparent;padding:10px 4px 12px;font-size:12px;font-weight:650;color:var(--muted);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;min-height:58px}
nav.tabs button svg{width:22px;height:22px}
nav.tabs button[aria-current="page"]{color:var(--accent)}
.screen{display:none}.screen.on{display:block}
/* sheet */
.scrim{position:fixed;inset:0;background:rgba(20,18,16,.38);display:none;z-index:20}
.scrim.on{display:block}
.sheet{position:fixed;left:0;right:0;bottom:0;margin:0 auto;max-width:480px;background:var(--card);border-radius:22px 22px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom));z-index:21;transform:translateY(105%);transition:transform .22s ease;max-height:92vh;overflow:auto}
.sheet.on{transform:none}
.sheet h3{margin:4px 0 14px;font-size:20px}
.field{margin-bottom:12px}
.field label{display:block;font-size:13px;font-weight:700;color:var(--muted);margin-bottom:6px;letter-spacing:.03em}
.field input,.field select{width:100%;border:1.5px solid var(--line);background:var(--bg);border-radius:12px;padding:12px;font-size:17px;min-height:48px}
.field input:focus,.field select:focus{outline:2px solid var(--accent);outline-offset:1px}
.amount-input{font-size:40px!important;font-weight:800;text-align:center;padding:14px!important}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--bg);padding:12px 16px;border-radius:14px;font-size:15px;font-weight:600;opacity:0;pointer-events:none;transition:.2s;z-index:30;display:flex;gap:14px;align-items:center;max-width:92vw}
.toast.on{opacity:1;transform:translateX(-50%);pointer-events:auto}
.toast button{background:transparent;border:0;color:var(--accent);font-weight:800;cursor:pointer;font-size:15px}
.grid100{display:grid;grid-template-columns:repeat(20,1fr);gap:2px;margin-top:12px}
.grid100 i{aspect-ratio:1;border-radius:3px;background:var(--sage-soft)}
.grid100 i.f{background:var(--sage)}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.kpi{background:var(--bg);border-radius:12px;padding:10px 12px}
.kpi .k{font-size:12px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.05em}
.kpi .v{font-size:18px;font-weight:800}
.seg{display:flex;background:var(--bg);border-radius:12px;padding:4px;gap:4px;margin-bottom:12px}
.seg button{flex:1;border:0;background:transparent;border-radius:9px;padding:10px;font-weight:700;cursor:pointer;min-height:42px}
.seg button[aria-pressed="true"]{background:var(--card);box-shadow:var(--shadow)}
.muted{color:var(--muted)}
.focus .hide-in-focus{display:none!important}
.mt{margin-top:10px}
a{color:var(--accent)}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
.welcome{text-align:center;padding-top:8vh}
.welcome .logo{width:64px;height:64px;border-radius:18px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-weight:800;font-size:28px;margin:0 auto 18px}
.steps{display:flex;gap:6px;justify-content:center;margin:18px 0}
.steps i{width:28px;height:5px;border-radius:9px;background:var(--line)}
.steps i.on{background:var(--accent)}
</style>
</head>
<body>
<div class="app" id="app"></div>
<nav class="tabs" id="tabs" hidden><div class="in">
  <button data-go="today"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>Today</button>
  <button data-go="bills"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/></svg>Bills</button>
  <button data-go="goals"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1"/></svg>Goals</button>
  <button data-go="debts"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 20l6-9 4 5 3-4 5 8z"/><path d="M15 4v5M15 4l4 1.5L15 7"/></svg>Debts</button>
  <button data-go="settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>Settings</button>
</div></nav>
<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true"></div>
<div class="toast" id="toast" role="status"><span id="toastMsg"></span><button id="toastUndo" hidden>Undo</button></div>

<script>
"use strict";
/* ============ Day Budget v1.0 · Working Student Series · personal use only ============ */
const VERSION = '1.0';
const KEY = 'daybudget.v1';
const CATS = ['Food','Groceries','Transport','Fun','Home','Health','Other'];

/* ---------- dates (local, YYYY-MM-DD) ---------- */
const pad = n => String(n).padStart(2,'0');
const iso = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parse = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); };
let NOW = () => new Date();
const today = () => iso(NOW());
const addDays = (s, n) => { const d = parse(s); d.setDate(d.getDate()+n); return iso(d); };
const addMonths = (s, n) => { const d = parse(s); const day = d.getDate(); d.setDate(1); d.setMonth(d.getMonth()+n);
  const last = new Date(d.getFullYear(), d.getMonth()+1, 0).getDate(); d.setDate(Math.min(day,last)); return iso(d); };
const daysBetween = (a, b) => Math.round((parse(b) - parse(a)) / 864e5);
const fmtDate = s => parse(s).toLocaleDateString(undefined,{weekday:'short', day:'numeric', month:'short'});
const fmtMonth = d => d.toLocaleDateString(undefined,{month:'long', year:'numeric'});

/* ---------- state ---------- */
const uid = () => Math.random().toString(36).slice(2,10);
function blank(){
  return { v:1, onboarded:false,
    settings:{ currency:'USD', cycle:'monthly', nextPay:addMonths(today(),1), floor:0, theme:'auto', focus:false, lastBackup:null, created:today() },
    balance:0, spends:[], incomes:[], bills:[], goals:[], debts:[], strategy:'avalanche', extra:0 };
}
let S;
function load(){
  try { const raw = localStorage.getItem(KEY); S = raw ? Object.assign(blank(), JSON.parse(raw)) : blank(); }
  catch(e){ S = blank(); }
  S.settings = Object.assign(blank().settings, S.settings || {});
}
function save(){ try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e){ toast('Could not save on this device'); } }

/* ---------- money ---------- */
const r2 = x => Math.round(x*100)/100;
function money(x, opts={}){
  const c = S.settings.currency;
  let out;
  try { out = new Intl.NumberFormat(undefined,{style:'currency',currency:c, maximumFractionDigits: opts.whole?0:2, minimumFractionDigits: opts.whole?0:2}).format(x); }
  catch(e){ out = (opts.whole?Math.round(x):x.toFixed(2)); }
  return out;
}
const num = v => { const n = parseFloat(String(v).replace(',', '.')); return isFinite(n) ? n : NaN; };
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* ---------- payday rollover ---------- */
function rollPayday(){
  const s = S.settings; let guard = 0;
  while (s.cycle !== 'irregular' && daysBetween(today(), s.nextPay) <= 0 && guard++ < 60){
    s.nextPay = s.cycle==='monthly' ? addMonths(s.nextPay,1) : addDays(s.nextPay, s.cycle==='biweekly'?14:7);
  }
}

/* ---------- core calc: safe to spend ---------- */
function billsBefore(dateIso){
  return S.bills.filter(b => b.nextDue <= dateIso).reduce((a,b)=>a+b.amount,0);
}
function calc(){
  const t = today();
  const end = S.settings.nextPay;
  const daysLeft = Math.max(1, daysBetween(t, end));        // days incl. today, until the day before payday
  const spentToday = S.spends.filter(x=>x.date===t).reduce((a,b)=>a+b.amount,0);
  const reserved = billsBefore(addDays(end,-1)) + (S.settings.floor||0);   // unpaid bills due before payday
  const untilPayday = S.balance - reserved;                // what is free after bills, as of now
  const startOfDayPool = untilPayday + spentToday;
  const perDay = startOfDayPool / daysLeft;
  const leftToday = perDay - spentToday;
  return { t, end, daysLeft, spentToday, reserved, untilPayday, perDay, leftToday };
}

/* ---------- debts simulation ---------- */
function simulate(debts, strategy, extra){
  let ds = debts.filter(d=>d.balance>0).map(d=>({...d, bal:d.balance}));
  if (!ds.length) return {months:0, interest:0, order:[], ok:true};
  const order = []; let interest = 0, m = 0;
  const pick = () => { const open = ds.filter(d=>d.bal>0.005);
    open.sort(strategy==='avalanche' ? (a,b)=>b.apr-a.apr || a.bal-b.bal : (a,b)=>a.bal-b.bal || b.apr-a.apr); return open[0]; };
  const budget = ds.reduce((a,d)=>a+d.min,0) + (extra||0);
  while (ds.some(d=>d.bal>0.005) && m < 600){
    m++;
    ds.forEach(d=>{ if(d.bal>0){ const i = d.bal*d.apr/1200; d.bal += i; interest += i; }});
    let pool = budget;
    ds.forEach(d=>{ if(d.bal>0){ const p = Math.min(d.min, d.bal); d.bal -= p; pool -= p; }});
    let tgt; while (pool > 0.005 && (tgt = pick())){ const p = Math.min(pool, tgt.bal); tgt.bal -= p; pool -= p; }
    ds.forEach(d=>{ if(d.bal<=0.005 && !order.find(o=>o.id===d.id)){ d.bal=0; order.push({id:d.id,name:d.name,month:m}); }});
    if (m===1 && ds.every(d=>d.bal>=d.balance-0.01) && budget<=0) break;
  }
  const ok = !ds.some(d=>d.bal>0.005);
  return { months:m, interest, order, ok };
}

/* ---------- UI helpers ---------- */
const $ = s => document.querySelector(s);
let screen = 'today', undoFn = null, toastTimer = null;
function toast(msg, undo){
  $('#toastMsg').textContent = msg; undoFn = undo || null; $('#toastUndo').hidden = !undo;
  $('#toast').classList.add('on'); clearTimeout(toastTimer); toastTimer = setTimeout(()=>$('#toast').classList.remove('on'), undo?5000:2400);
}
$('#toastUndo').onclick = () => { if (undoFn){ undoFn(); undoFn=null; save(); render(); } $('#toast').classList.remove('on'); };
function openSheet(html, focusSel){
  $('#sheet').innerHTML = html; $('#sheet').classList.add('on'); $('#scrim').classList.add('on');
  setTimeout(()=>{ const f = focusSel && $('#sheet '+focusSel); if (f) f.focus(); }, 60);
}
function closeSheet(){ $('#sheet').classList.remove('on'); $('#scrim').classList.remove('on'); }
$('#scrim').onclick = closeSheet;
document.addEventListener('keydown', e => { if (e.key==='Escape') closeSheet(); });
function applyTheme(){
  const t = S.settings.theme;
  if (t==='auto') document.documentElement.removeAttribute('data-theme'); else document.documentElement.setAttribute('data-theme', t);
  document.body.classList.toggle('focus', !!S.settings.focus);
}

/* ---------- screens ---------- */
function greet(){ const h = NOW().getHours(); return h<12?'Good morning':h<18?'Good afternoon':'Good evening'; }

function vToday(){
  const c = calc();
  const used = c.perDay>0 ? Math.min(100, c.spentToday/c.perDay*100) : 100;
  const over = c.leftToday < 0;
  const todays = S.spends.filter(x=>x.date===c.t).slice().reverse();
  const upcoming = S.bills.filter(b=>daysBetween(c.t,b.nextDue) <= 14).sort((a,b)=>a.nextDue.localeCompare(b.nextDue));
  const needBackup = (S.spends.length+S.bills.length+S.goals.length+S.debts.length) > 3 &&
    (!S.settings.lastBackup || daysBetween(S.settings.lastBackup, c.t) >= 14);
  const payLabel = S.settings.cycle==='irregular' ? 'next money expected' : 'payday';
  return `
  <header class="top">
    <div><div class="date">${esc(NOW().toLocaleDateString(undefined,{weekday:'long',day:'numeric',month:'long'}))}</div><h1>${greet()}</h1></div>
    <button class="chip-btn" data-act="focus" aria-pressed="${!!S.settings.focus}" title="Focus mode hides everything except today">Focus</button>
  </header>
  ${needBackup ? `<div class="note hide-in-focus"><div class="grow"><b>Save a backup?</b><br><span class="muted">Your data lives only on this device. One tap keeps it safe.</span></div><button class="mini" data-act="export">Back up</button></div>`:''}
  <section class="card hero" aria-live="polite">
    <div class="label">Safe to spend today</div>
    <div class="big ${over?'neg':''}" id="safeToday">${over ? '−'+money(-c.leftToday) : money(c.leftToday)}</div>
    <div class="sub">${over ? 'A bit over today. Tomorrow re-balances itself.' : `of ${money(c.perDay)} for today`}</div>
    <div class="bar ${over?'over':''}"><i style="width:${Math.max(0,used).toFixed(1)}%"></i></div>
    <div class="sub">${money(Math.max(0,c.untilPayday))} free until ${payLabel} · ${fmtDate(c.end)} · ${c.daysLeft} day${c.daysLeft>1?'s':''}</div>
  </section>
  <button class="btn primary" data-act="spend" id="logBtn">+ Log a spend</button>
  <div class="row2 mt hide-in-focus">
    <button class="btn ghost" data-act="income">Got money in</button>
    <button class="btn ghost" data-act="explain">How it works</button>
  </div>
  <section class="card hide-in-focus">
    <h2>Coming up · next 14 days</h2>
    ${upcoming.length ? `<ul class="list">${upcoming.map(b=>{const d=daysBetween(c.t,b.nextDue);return `
      <li><div class="grow"><div class="t">${esc(b.name)}</div><div class="s">${d<0?'overdue · ':''}${fmtDate(b.nextDue)}</div></div>
      <span class="pill ${d<=3?'due':''}">${d<=0?'due':d===1?'tomorrow':'in '+d+' days'}</span>
      <span class="amt">${money(b.amount)}</span>
      <button class="mini" data-act="paybill" data-id="${b.id}" aria-label="Mark ${esc(b.name)} as paid">Paid</button></li>`}).join('')}</ul>`
      : `<div class="empty">Nothing due. Add your bills in the Bills tab so today's number stays honest.</div>`}
  </section>
  <section class="card">
    <h2>Logged today</h2>
    ${todays.length ? `<ul class="list">${todays.map(x=>`
      <li><div class="grow"><div class="t">${esc(x.note||x.cat)}</div><div class="s">${esc(x.cat)}</div></div>
      <span class="amt">${money(x.amount)}</span>
      <button class="icon-btn" data-act="delspend" data-id="${x.id}" aria-label="Delete">×</button></li>`).join('')}</ul>`
      : `<div class="empty">Nothing yet. Every logged spend counts, even a coffee.</div>`}
  </section>`;
}

function vBills(){
  const t = today();
  const bills = S.bills.slice().sort((a,b)=>a.nextDue.localeCompare(b.nextDue));
  const monthly = S.bills.reduce((a,b)=>a + (b.freq==='weekly'?b.amount*52/12 : b.freq==='yearly'?b.amount/12 : b.freq==='once'?0 : b.amount),0);
  return `<header class="top"><div><div class="date">Must-pays</div><h1>Bills</h1></div><button class="chip-btn" data-act="addbill">+ Add</button></header>
  <section class="card"><div class="kpis" style="margin-top:0">
    <div class="kpi"><div class="k">Per month</div><div class="v">${money(monthly)}</div></div>
    <div class="kpi"><div class="k">Before payday</div><div class="v">${money(billsBefore(addDays(S.settings.nextPay,-1)))}</div></div>
  </div><p class="muted" style="margin:12px 0 0;font-size:14px">Bills due before your next payday are set aside automatically, so "safe to spend" never counts rent money.</p></section>
  <section class="card">${bills.length ? `<ul class="list">${bills.map(b=>{const d=daysBetween(t,b.nextDue);return `
    <li><div class="grow"><div class="t">${esc(b.name)}</div><div class="s">${fmtDate(b.nextDue)} · ${b.freq}</div></div>
    <span class="amt">${money(b.amount)}</span>
    <button class="mini" data-act="paybill" data-id="${b.id}">Paid</button>
    <button class="icon-btn" data-act="editbill" data-id="${b.id}" aria-label="Edit">✎</button></li>`}).join('')}</ul>`
    : `<div class="empty">No bills yet. Start with the big three: rent, phone, internet.</div>`}</section>`;
}

function vGoals(){
  return `<header class="top"><div><div class="date">Set money aside</div><h1>Goals</h1></div><button class="chip-btn" data-act="addgoal">+ Add</button></header>
  ${S.goals.length ? S.goals.map(g=>{const p = g.target>0?Math.min(100,g.saved/g.target*100):0; const f=Math.floor(p);
    return `<section class="card"><div style="display:flex;justify-content:space-between;align-items:baseline;gap:10px">
      <div><div class="t" style="font-weight:750;font-size:18px">${esc(g.name)}</div><div class="muted" style="font-size:14px">${money(g.saved)} of ${money(g.target)}</div></div>
      <div class="amt" style="font-size:22px">${Math.round(p)}%</div></div>
      <div class="grid100" aria-label="${f} of 100 squares filled">${Array.from({length:100},(_,i)=>`<i class="${i<f?'f':''}"></i>`).join('')}</div>
      <div class="row2 mt" style="margin-bottom:0"><button class="btn small primary" data-act="goaladd" data-id="${g.id}">+ Add money</button>
      <button class="btn small ghost" data-act="goaledit" data-id="${g.id}">Edit / take out</button></div></section>`}).join('')
  : `<section class="card"><div class="empty">A goal can be tiny. Most people start with an emergency buffer: one month of rent.</div>
     <button class="btn ghost mt" data-act="addgoal" data-preset="Emergency buffer">Start an emergency buffer</button></section>`}
  <p class="muted" style="font-size:14px">Money you add to a goal leaves "safe to spend", so you can't accidentally spend it.</p>`;
}

function vDebts(){
  const sim = simulate(S.debts, S.strategy, S.extra);
  const total = S.debts.reduce((a,d)=>a+d.balance,0), orig = S.debts.reduce((a,d)=>a+(d.start||d.balance),0);
  const paidPct = orig>0 ? Math.max(0,Math.min(100,(1-total/orig)*100)) : 0;
  const end = new Date(NOW().getFullYear(), NOW().getMonth()+sim.months, 1);
  const rank = S.debts.slice().filter(d=>d.balance>0).sort(S.strategy==='avalanche'?(a,b)=>b.apr-a.apr:(a,b)=>a.balance-b.balance);
  return `<header class="top"><div><div class="date">Climb out</div><h1>Debts</h1></div><button class="chip-btn" data-act="adddebt">+ Add</button></header>
  ${S.debts.length ? `<section class="card">
    <div style="display:flex;justify-content:space-between;align-items:baseline"><div class="muted" style="font-weight:700">Total left</div><div class="amt" style="font-size:26px">${money(total)}</div></div>
    <div class="grid100">${Array.from({length:100},(_,i)=>`<i class="${i<Math.floor(paidPct)?'f':''}"></i>`).join('')}</div>
    <div class="kpis">
      <div class="kpi"><div class="k">Debt-free</div><div class="v" id="debtFree">${total<=0?'Done!':sim.ok?esc(fmtMonth(end)):'Not yet'}</div></div>
      <div class="kpi"><div class="k">Interest to go</div><div class="v">${sim.ok?money(sim.interest,{whole:true}):'—'}</div></div>
    </div>
    ${!sim.ok && total>0 ? `<p class="muted" style="font-size:14px;margin:10px 0 0">At these payments the balance doesn't shrink. Add a little extra per month and watch the date appear.</p>`:''}
  </section>
  <section class="card"><h2>Strategy</h2>
    <div class="seg" role="group"><button data-act="strat" data-v="avalanche" aria-pressed="${S.strategy==='avalanche'}">Avalanche<br><small class="muted">highest interest first</small></button>
    <button data-act="strat" data-v="snowball" aria-pressed="${S.strategy==='snowball'}">Snowball<br><small class="muted">smallest balance first</small></button></div>
    <div class="field"><label for="extra">Extra per month on top of minimums</label><input id="extra" inputmode="decimal" value="${S.extra||''}" placeholder="0" data-act="extra"></div>
  </section>
  <section class="card"><h2>Pay in this order</h2><ul class="list">${rank.map((d,i)=>`
    <li><div class="grow"><div class="t">${i+1}. ${esc(d.name)}</div><div class="s">${d.apr}% · min ${money(d.min)}</div></div>
    <span class="amt">${money(d.balance)}</span>
    <button class="mini" data-act="debtpay" data-id="${d.id}">Pay</button>
    <button class="icon-btn" data-act="editdebt" data-id="${d.id}" aria-label="Edit">✎</button></li>`).join('')}</ul>
    ${S.debts.some(d=>d.balance<=0)?`<p class="muted" style="font-size:14px">Paid off: ${S.debts.filter(d=>d.balance<=0).map(d=>esc(d.name)).join(', ')} 🎉</p>`:''}
  </section>`
  : `<section class="card"><div class="empty">No debts added. If you have any, add them here to get a real debt-free date. If not, enjoy this empty screen.</div></section>`}`;
}

function vSettings(){
  const s = S.settings;
  const cur = ['USD','EUR','GBP','CAD','AUD','NZD','CHF','SEK','NOK','DKK','PLN','INR','JPY'];
  return `<header class="top"><div><div class="date">Day Budget v${VERSION}</div><h1>Settings</h1></div></header>
  <section class="card"><h2>Money</h2>
    <div class="field"><label>Money in my account right now</label><input id="setBal" inputmode="decimal" value="${r2(S.balance)}"></div>
    <div class="field"><label>Income rhythm</label><select id="setCycle">
      ${[['monthly','Monthly'],['biweekly','Every 2 weeks'],['weekly','Weekly'],['irregular','Irregular (shifts, freelance)']].map(([v,l])=>`<option value="${v}" ${s.cycle===v?'selected':''}>${l}</option>`).join('')}</select></div>
    <div class="field"><label>${s.cycle==='irregular'?'Next money expected':'Next payday'}</label><input id="setPay" type="date" value="${s.nextPay}"></div>
    <div class="field"><label>Always keep at least (safety floor)</label><input id="setFloor" inputmode="decimal" value="${s.floor||0}"></div>
    <div class="field"><label>Currency</label><select id="setCur">${cur.map(c=>`<option ${s.currency===c?'selected':''}>${c}</option>`).join('')}</select></div>
    <button class="btn primary" data-act="savesettings">Save</button>
  </section>
  <section class="card"><h2>Look</h2>
    <div class="seg">${['auto','light','dark'].map(t=>`<button data-act="theme" data-v="${t}" aria-pressed="${s.theme===t}">${t[0].toUpperCase()+t.slice(1)}</button>`).join('')}</div>
  </section>
  <section class="card"><h2>Backup</h2>
    <p class="muted" style="margin-top:0;font-size:15px">Everything is stored only on this device, in this browser. Nothing is sent anywhere. Download a backup file now and then, and keep it in your files or cloud.</p>
    <p style="font-size:14px" class="muted">Last backup: <b>${s.lastBackup?esc(fmtDate(s.lastBackup)):'never'}</b></p>
    <div class="row2" style="margin-bottom:0"><button class="btn small primary" data-act="export">Download backup</button>
    <label class="btn small ghost" style="cursor:pointer">Restore backup<input type="file" accept=".json,application/json" id="importFile" hidden></label></div>
  </section>
  <section class="card"><h2>Help</h2>
    <p style="margin-top:0;font-size:15px"><b>Safe to spend today</b> = money in your account − bills due before payday − your safety floor, spread evenly over the days left. Spend less today and tomorrow's number grows. Spend more and it shrinks. No guilt either way.</p>
    <p style="font-size:15px"><b>Tip:</b> once a week, compare "money in my account" with your banking app and correct it here. Small differences are normal.</p>
    <button class="btn ghost" data-act="reset">Erase all data on this device</button>
  </section>
  <p class="muted" style="font-size:12px;text-align:center">Day Budget · Working Student Series · for personal use only · not financial advice</p>`;
}

/* ---------- onboarding ---------- */
let ob = {step:0};
function vWelcome(){
  const st = ob.step;
  const dots = `<div class="steps">${[0,1,2].map(i=>`<i class="${i<=st?'on':''}"></i>`).join('')}</div>`;
  if (st===0) return `<div class="welcome"><div class="logo">D</div><h1>One number a day.</h1>
    <p class="muted" style="font-size:17px">Day Budget tells you what you can spend <b>today</b> without touching rent, bills or savings. Three quick questions and you're set.</p>${dots}
    <button class="btn primary" data-act="ob-next">Let's go</button>
    <button class="btn ghost mt" data-act="demo">Just look around with example data</button>
    <p class="muted" style="font-size:13px;margin-top:22px">Private by design: no account, no cloud, nothing leaves this device.</p></div>`;
  if (st===1) return `<div class="welcome" style="text-align:left"><h1>How much is in your account right now?</h1>
    <p class="muted">Your main spending account. A rough number is fine.</p>${dots}
    <div class="field"><input id="obBal" class="amount-input" inputmode="decimal" placeholder="0" value="${ob.bal??''}"></div>
    <div class="field"><label>Currency</label><select id="obCur">${['USD','EUR','GBP','CAD','AUD','NZD','CHF','SEK','NOK','DKK','PLN','INR','JPY'].map(c=>`<option ${S.settings.currency===c?'selected':''}>${c}</option>`).join('')}</select></div>
    <button class="btn primary" data-act="ob-next">Next</button></div>`;
  return `<div class="welcome" style="text-align:left"><h1>When does money come in next?</h1>
    <p class="muted">Paid irregularly? Pick "Irregular" and enter the date you expect money next.</p>${dots}
    <div class="field"><label>Income rhythm</label><select id="obCycle">
      ${[['monthly','Monthly'],['biweekly','Every 2 weeks'],['weekly','Weekly'],['irregular','Irregular']].map(([v,l])=>`<option value="${v}">${l}</option>`).join('')}</select></div>
    <div class="field"><label>Next payday</label><input id="obPay" type="date" value="${addDays(today(),14)}" min="${addDays(today(),1)}"></div>
    <button class="btn primary" data-act="ob-done">Show me my number</button></div>`;
}

function loadDemo(){
  const t = today();
  S = blank(); S.onboarded = true;
  Object.assign(S.settings,{currency:'USD', cycle:'monthly', nextPay:addDays(t,9), floor:50, lastBackup:addDays(t,-3)});
  S.balance = 1486.40;
  S.bills = [
    {id:uid(),name:'Phone',amount:29,freq:'monthly',nextDue:addDays(t,1)},
    {id:uid(),name:'Internet',amount:45,freq:'monthly',nextDue:addDays(t,5)},
    {id:uid(),name:'Streaming',amount:11.99,freq:'monthly',nextDue:addDays(t,6)},
    {id:uid(),name:'Rent',amount:780,freq:'monthly',nextDue:addDays(t,12)},
    {id:uid(),name:'Gym',amount:25,freq:'monthly',nextDue:addDays(t,19)}];
  S.spends = [
    {id:uid(),date:t,amount:4.5,cat:'Food',note:'Coffee'},
    {id:uid(),date:t,amount:12.8,cat:'Groceries',note:''},
    {id:uid(),date:addDays(t,-1),amount:23,cat:'Fun',note:'Cinema'}];
  S.goals = [{id:uid(),name:'Emergency buffer',target:1000,saved:370},{id:uid(),name:'Laptop',target:900,saved:155}];
  S.debts = [{id:uid(),name:'Credit card',balance:2340,start:3000,apr:24.7,min:75},{id:uid(),name:'Phone plan',balance:410,start:600,apr:0,min:35}];
  S.extra = 50; S.demo = true;
}

/* ---------- render ---------- */
function render(){
  rollPayday(); applyTheme();
  const app = $('#app');
  if (!S.onboarded){ $('#tabs').hidden = true; app.innerHTML = vWelcome(); return; }
  $('#tabs').hidden = false;
  app.innerHTML = `<div class="screen on" id="screen-${screen}">${({today:vToday,bills:vBills,goals:vGoals,debts:vDebts,settings:vSettings})[screen]()}</div>`;
  document.querySelectorAll('nav.tabs button').forEach(b=>b.setAttribute('aria-current', b.dataset.go===screen?'page':'false'));
  const f = $('#importFile'); if (f) f.onchange = importFile;
  const ex = $('#extra'); if (ex) ex.onchange = () => { const v = num(ex.value); S.extra = isNaN(v)?0:Math.max(0,v); save(); render(); };
}
function go(s){ screen = s; location.hash = s; render(); window.scrollTo(0,0); }
document.querySelectorAll('nav.tabs button').forEach(b=>b.onclick=()=>go(b.dataset.go));

/* ---------- sheets ---------- */
function spendSheet(){
  const recent = [...new Set(S.spends.slice(-30).map(x=>x.amount))].slice(-4);
  openSheet(`<h3>Log a spend</h3>
    <div class="field"><input id="spAmt" class="amount-input" inputmode="decimal" placeholder="0.00" aria-label="Amount"></div>
    ${recent.length?`<div class="chips">${recent.map(a=>`<button class="chip-btn" data-fill="${a}">${money(a)}</button>`).join('')}</div>`:''}
    <div class="chips" role="group" aria-label="Category">${CATS.map((c,i)=>`<button class="chip-btn" data-cat="${c}" aria-pressed="${i===0}">${c}</button>`).join('')}</div>
    <div class="field"><input id="spNote" placeholder="Note (optional)" maxlength="60"></div>
    <div class="field"><label>Date</label><input id="spDate" type="date" value="${today()}" max="${today()}"></div>
    <button class="btn primary" data-act="spend-save">Save</button>`, '#spAmt');
}
function incomeSheet(){
  const s = S.settings;
  openSheet(`<h3>Money in</h3>
    <div class="field"><input id="inAmt" class="amount-input" inputmode="decimal" placeholder="0.00" aria-label="Amount"></div>
    <div class="field"><input id="inNote" placeholder="From (optional), e.g. paycheck" maxlength="60"></div>
    <div class="field"><label>${s.cycle==='irregular'?'When do you expect money next?':'Next payday after this one'}</label>
      <input id="inNext" type="date" value="${s.cycle==='irregular'?addDays(today(),14):s.nextPay}" min="${addDays(today(),1)}"></div>
    <button class="btn primary" data-act="income-save">Add</button>`, '#inAmt');
}
function billSheet(b){
  b = b || {name:'',amount:'',freq:'monthly',nextDue:addDays(today(),7)};
  openSheet(`<h3>${b.id?'Edit bill':'New bill'}</h3>
    <div class="field"><label>Name</label><input id="bName" value="${esc(b.name)}" placeholder="Rent" maxlength="40"></div>
    <div class="field"><label>Amount</label><input id="bAmt" inputmode="decimal" value="${b.amount}"></div>
    <div class="field"><label>Next due date</label><input id="bDue" type="date" value="${b.nextDue}"></div>
    <div class="field"><label>Repeats</label><select id="bFreq">${['monthly','weekly','yearly','once'].map(f=>`<option ${b.freq===f?'selected':''}>${f}</option>`).join('')}</select></div>
    <button class="btn primary" data-act="bill-save" data-id="${b.id||''}">Save</button>
    ${b.id?`<button class="btn ghost mt" data-act="bill-del" data-id="${b.id}">Delete bill</button>`:''}`, b.id?null:'#bName');
}
function goalSheet(g, preset){
  g = g || {name:preset||'',target:'',saved:0};
  openSheet(`<h3>${g.id?'Edit goal':'New goal'}</h3>
    <div class="field"><label>Name</label><input id="gName" value="${esc(g.name)}" placeholder="Emergency buffer" maxlength="40"></div>
    <div class="field"><label>Target amount</label><input id="gTarget" inputmode="decimal" value="${g.target}"></div>
    ${g.id?`<div class="field"><label>Take money out (goes back to safe to spend)</label><input id="gOut" inputmode="decimal" placeholder="0"></div>`:''}
    <button class="btn primary" data-act="goal-save" data-id="${g.id||''}">Save</button>
    ${g.id?`<button class="btn ghost mt" data-act="goal-del" data-id="${g.id}">Delete goal (money goes back)</button>`:''}`, g.id?null:'#gName');
}
function amountSheet(title, act, id, hint){
  openSheet(`<h3>${esc(title)}</h3>${hint?`<p class="muted" style="margin-top:-6px">${hint}</p>`:''}
    <div class="field"><input id="xAmt" class="amount-input" inputmode="decimal" placeholder="0.00"></div>
    <button class="btn primary" data-act="${act}" data-id="${id}">Save</button>`, '#xAmt');
}
function debtSheet(d){
  d = d || {name:'',balance:'',apr:'',min:''};
  openSheet(`<h3>${d.id?'Edit debt':'New debt'}</h3>
    <div class="field"><label>Name</label><input id="dName" value="${esc(d.name)}" placeholder="Credit card" maxlength="40"></div>
    <div class="field"><label>Balance left</label><input id="dBal" inputmode="decimal" value="${d.balance}"></div>
    <div class="field"><label>Interest rate (APR %)</label><input id="dApr" inputmode="decimal" value="${d.apr}" placeholder="0 if interest-free"></div>
    <div class="field"><label>Minimum payment per month</label><input id="dMin" inputmode="decimal" value="${d.min}"></div>
    <button class="btn primary" data-act="debt-save" data-id="${d.id||''}">Save</button>
    ${d.id?`<button class="btn ghost mt" data-act="debt-del" data-id="${d.id}">Delete debt</button>`:''}`, d.id?null:'#dName');
}
function explainSheet(){
  const c = calc();
  openSheet(`<h3>How today's number works</h3>
    <ul class="list">
      <li><div class="grow">Money in your account</div><span class="amt">${money(S.balance)}</span></li>
      <li><div class="grow">Bills due before ${fmtDate(c.end)}</div><span class="amt">− ${money(c.reserved-(S.settings.floor||0))}</span></li>
      <li><div class="grow">Safety floor</div><span class="amt">− ${money(S.settings.floor||0)}</span></li>
      <li><div class="grow"><b>Free until payday</b></div><span class="amt">${money(c.untilPayday)}</span></li>
      <li><div class="grow">Today's share (incl. today's spends) ÷ ${c.daysLeft} day${c.daysLeft>1?'s':''}</div><span class="amt">${money(c.perDay)}</span></li>
      <li><div class="grow">Spent today</div><span class="amt">− ${money(c.spentToday)}</span></li>
      <li><div class="grow"><b>Safe to spend today</b></div><span class="amt">${money(c.leftToday)}</span></li>
    </ul><button class="btn primary mt" data-act="close">Got it</button>`);
}

/* ---------- actions ---------- */
function readAmt(sel){ const v = num($(sel)?.value); return isNaN(v)||v<0 ? NaN : r2(v); }
function exportData(){
  S.settings.lastBackup = today(); save();
  const blob = new Blob([JSON.stringify(S,null,1)], {type:'application/json'});
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `daybudget-backup-${today()}.json`;
  document.body.appendChild(a); a.click(); setTimeout(()=>{URL.revokeObjectURL(a.href); a.remove();}, 500);
  toast('Backup downloaded'); render();
}
function importFile(e){
  const f = e.target.files[0]; if (!f) return;
  const rd = new FileReader();
  rd.onload = () => { try { const d = JSON.parse(rd.result);
      if (!d || typeof d!=='object' || !('balance' in d) || !Array.isArray(d.bills)) throw 0;
      if (!confirm('Replace the data on this device with this backup?')) return;
      S = Object.assign(blank(), d); S.settings = Object.assign(blank().settings, d.settings||{}); S.onboarded = true; save(); toast('Backup restored'); go('today');
    } catch(err){ toast('That file is not a Day Budget backup'); } };
  rd.readAsText(f);
}

document.addEventListener('click', e => {
  const fill = e.target.closest('[data-fill]'); if (fill){ $('#spAmt').value = fill.dataset.fill; return; }
  const cat = e.target.closest('[data-cat]'); if (cat){ cat.parentElement.querySelectorAll('[data-cat]').forEach(b=>b.setAttribute('aria-pressed', b===cat)); return; }
  const el = e.target.closest('[data-act]'); if (!el || el.tagName==='INPUT') return;
  const act = el.dataset.act, id = el.dataset.id;
  const find = (arr) => arr.find(x=>x.id===id);
  switch(act){
    case 'ob-next':
      if (ob.step===1){ const v = readAmt('#obBal'); if (isNaN(v)){ toast('Enter a number, even 0'); return; } ob.bal = v; S.settings.currency = $('#obCur').value; }
      ob.step++; render(); break;
    case 'ob-done': {
      const pay = $('#obPay').value; if (!pay || pay <= today()){ toast('Pick a date in the future'); return; }
      S.balance = ob.bal||0; S.settings.cycle = $('#obCycle').value; S.settings.nextPay = pay; S.onboarded = true; save(); go('today'); toast('All set. Add your bills next.'); break; }
    case 'demo': loadDemo(); save(); go('today'); toast('Example data loaded. Erase it in Settings.'); break;
    case 'focus': S.settings.focus = !S.settings.focus; save(); render(); break;
    case 'spend': spendSheet(); break;
    case 'spend-save': {
      const v = readAmt('#spAmt'); if (!v){ toast('Enter an amount'); return; }
      const c = $('#sheet [data-cat][aria-pressed="true"]')?.dataset.cat || 'Other';
      const x = {id:uid(), date:$('#spDate').value||today(), amount:v, cat:c, note:$('#spNote').value.trim()};
      S.spends.push(x); S.balance = r2(S.balance - v); save(); closeSheet(); render();
      toast(`Logged ${money(v)}. That counts.`, ()=>{ S.spends = S.spends.filter(s=>s.id!==x.id); S.balance = r2(S.balance + v); }); break; }
    case 'delspend': { const x = find(S.spends); if (!x) return; S.spends = S.spends.filter(s=>s!==x); S.balance = r2(S.balance + x.amount); save(); render();
      toast('Deleted', ()=>{ S.spends.push(x); S.balance = r2(S.balance - x.amount); }); break; }
    case 'income': incomeSheet(); break;
    case 'income-save': {
      const v = readAmt('#inAmt'); if (!v){ toast('Enter an amount'); return; }
      const nx = $('#inNext').value; if (!nx || nx <= today()){ toast('Pick a future date'); return; }
      S.incomes.push({id:uid(), date:today(), amount:v, note:$('#inNote').value.trim()}); S.balance = r2(S.balance + v); S.settings.nextPay = nx;
      save(); closeSheet(); render(); toast(`${money(v)} added. Nice.`); break; }
    case 'explain': explainSheet(); break;
    case 'close': closeSheet(); break;
    case 'addbill': billSheet(); break;
    case 'editbill': billSheet(find(S.bills)); break;
    case 'bill-save': {
      const name = $('#bName').value.trim(), v = readAmt('#bAmt'), due = $('#bDue').value, fr = $('#bFreq').value;
      if (!name || isNaN(v) || !due){ toast('Name, amount and date please'); return; }
      if (id){ Object.assign(find(S.bills), {name, amount:v, nextDue:due, freq:fr}); } else S.bills.push({id:uid(), name, amount:v, nextDue:due, freq:fr});
      save(); closeSheet(); render(); toast('Bill saved'); break; }
    case 'bill-del': S.bills = S.bills.filter(b=>b.id!==id); save(); closeSheet(); render(); toast('Bill deleted'); break;
    case 'paybill': {
      const b = find(S.bills); if (!b) return; const prev = {...b};
      S.balance = r2(S.balance - b.amount);
      if (b.freq==='once') S.bills = S.bills.filter(x=>x!==b);
      else b.nextDue = b.freq==='monthly'?addMonths(b.nextDue,1):b.freq==='weekly'?addDays(b.nextDue,7):addMonths(b.nextDue,12);
      save(); render();
      toast(`${b.name} paid`, ()=>{ S.balance = r2(S.balance + prev.amount); const i = S.bills.findIndex(x=>x.id===prev.id); if (i>=0) S.bills[i] = prev; else S.bills.push(prev); }); break; }
    case 'addgoal': goalSheet(null, el.dataset.preset); break;
    case 'goaledit': goalSheet(find(S.goals)); break;
    case 'goal-save': {
      const name = $('#gName').value.trim(), tg = readAmt('#gTarget'); if (!name || !tg){ toast('Name and target please'); return; }
      if (id){ const g = find(S.goals); g.name = name; g.target = tg; const out = readAmt('#gOut');
        if (out>0){ const o = Math.min(out, g.saved); g.saved = r2(g.saved - o); S.balance = r2(S.balance + o); } }
      else S.goals.push({id:uid(), name, target:tg, saved:0});
      save(); closeSheet(); render(); toast('Goal saved'); break; }
    case 'goal-del': { const g = find(S.goals); S.balance = r2(S.balance + (g?.saved||0)); S.goals = S.goals.filter(x=>x.id!==id); save(); closeSheet(); render(); toast('Goal deleted'); break; }
    case 'goaladd': amountSheet('Add to '+find(S.goals).name, 'goaladd-save', id, 'Moves money out of "safe to spend".'); break;
    case 'goaladd-save': { const v = readAmt('#xAmt'); if (!v) return; const g = find(S.goals); g.saved = r2(g.saved + v); S.balance = r2(S.balance - v);
      save(); closeSheet(); render(); toast(g.saved>=g.target?`${g.name} complete!`:`${money(v)} set aside`); break; }
    case 'adddebt': debtSheet(); break;
    case 'editdebt': debtSheet(find(S.debts)); break;
    case 'debt-save': {
      const name = $('#dName').value.trim(), b = readAmt('#dBal'), apr = num($('#dApr').value)||0, mn = readAmt('#dMin');
      if (!name || isNaN(b) || isNaN(mn)){ toast('Name, balance and minimum please'); return; }
      if (id){ const d = find(S.debts); Object.assign(d,{name, balance:b, apr:Math.max(0,apr), min:mn}); if ((d.start||0) < b) d.start = b; }
      else S.debts.push({id:uid(), name, balance:b, start:b, apr:Math.max(0,apr), min:mn});
      save(); closeSheet(); render(); toast('Debt saved'); break; }
    case 'debt-del': S.debts = S.debts.filter(d=>d.id!==id); save(); closeSheet(); render(); break;
    case 'debtpay': amountSheet('Payment to '+find(S.debts).name, 'debtpay-save', id, 'Comes out of your account balance.'); break;
    case 'debtpay-save': { const v = readAmt('#xAmt'); if (!v) return; const d = find(S.debts); const p = Math.min(v, d.balance);
      d.balance = r2(d.balance - p); S.balance = r2(S.balance - p); save(); closeSheet(); render(); toast(d.balance<=0?`${d.name} is paid off!`:`${money(p)} off ${d.name}`); break; }
    case 'strat': S.strategy = el.dataset.v; save(); render(); break;
    case 'theme': S.settings.theme = el.dataset.v; save(); render(); break;
    case 'savesettings': {
      const b = num($('#setBal').value), fl = num($('#setFloor').value), pay = $('#setPay').value;
      if (isNaN(b)){ toast('Balance must be a number'); return; }
      if (!pay || pay <= today()){ toast('Payday must be in the future'); return; }
      S.balance = r2(b); S.settings.floor = isNaN(fl)?0:Math.max(0,r2(fl)); S.settings.nextPay = pay; S.settings.cycle = $('#setCycle').value; S.settings.currency = $('#setCur').value;
      save(); render(); toast('Saved'); break; }
    case 'export': exportData(); break;
    case 'reset': if (confirm('Erase everything on this device? Download a backup first if unsure.')){ localStorage.removeItem(KEY); S = blank(); ob = {step:0}; render(); } break;
  }
});
document.addEventListener('keydown', e => { if (e.key==='Enter' && e.target.matches('#sheet input:not([type=file])')){ const b = $('#sheet .btn.primary'); if (b) b.click(); }});

/* ---------- installable/offline when hosted (https) ---------- */
if (location.protocol === 'https:' || location.hostname === 'localhost'){
  const l = document.createElement('link'); l.rel = 'manifest'; l.href = 'manifest.webmanifest'; document.head.appendChild(l);
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});
}
/* ---------- boot ---------- */
load();
const h = location.hash.replace('#','').replace('screen-','');
if (['today','bills','goals','debts','settings'].includes(h)) screen = h;
render();
window.addEventListener('focus', () => { if (S.onboarded && !$('#sheet').classList.contains('on')) render(); });
</script>
</body>
</html>
